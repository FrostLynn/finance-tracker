services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: finance-backend
    restart: unless-stopped
    environment:
      PORT: "8085"
      DATABASE_URL: "postgres://postgres:postgres@finance-postgres:5432/financetrack?sslmode=disable"
    ports:
      - "8085:8085"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

networks:
  default:
    name: finance_network
    external: true
