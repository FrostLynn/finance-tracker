services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financetrack
    ports:
      - "5432:5432"
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financetrack"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finance_network

volumes:
  finance_postgres_data:
    name: finance_postgres_data

networks:
  finance_network:
    name: finance_network
